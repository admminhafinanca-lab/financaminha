<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FinançaMinha — Nova senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#09090d;--s1:#111318;--s2:#181b22;--s3:#1e2230;
      --b1:rgba(255,255,255,.09);--text:#eeeef0;--muted:#7a7f96;
      --green:#4ade80;--red:#f87171;--acc:#c8ff57;
      --ff:'Syne',sans-serif;--fb:'Instrument Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;
         min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .box{background:var(--s1);border:1px solid var(--b1);border-radius:20px;
         width:100%;max-width:400px;padding:2.5rem 2rem}
    .logo{font-family:var(--ff);font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px}
    h2{font-family:var(--ff);font-size:17px;font-weight:700;margin-bottom:6px}
    .sub{font-size:12px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
    .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .field input{background:var(--s2);border:1px solid var(--b1);border-radius:8px;
      color:var(--text);font-family:var(--fb);font-size:14px;padding:10px 12px;
      outline:none;transition:border-color .15s}
    .field input:focus{border-color:var(--acc)}
    .btn{width:100%;padding:12px;background:var(--acc);color:#09090d;border:none;
         border-radius:8px;font-family:var(--fb);font-size:14px;font-weight:600;
         cursor:pointer;transition:opacity .15s;margin-top:.5rem}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.45;cursor:default}
    #msg{font-size:12px;min-height:18px;text-align:center;margin-top:.75rem}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">FinançaMinha</div>
    <h2>🔑 Nova senha</h2>
    <div class="sub">Escolha uma nova senha para sua conta.</div>
    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="pass1" placeholder="mínimo 6 caracteres"
             oninput="validate()" onkeydown="if(event.key==='Enter')document.getElementById('pass2').focus()">
    </div>
    <div class="field">
      <label>Confirmar senha</label>
      <input type="password" id="pass2" placeholder="repita a senha"
             oninput="validate()" onkeydown="if(event.key==='Enter')doReset()">
    </div>
    <div id="msg"></div>
    <button class="btn" id="btn-reset" onclick="doReset()">Salvar nova senha</button>
  </div>

  <script>
    const SUPABASE_URL      = 'https://iapsjwiahrngytrxawrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6rRbVuPIfuF56utFPfVzLg_waXyH5XS';
    const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // The recovery session arrives via onAuthStateChange
    _sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // token already in URL, Supabase handles it — page is ready
        console.log('[forgot] PASSWORD_RECOVERY session ready');
      }
    });

    function validate() {
      const p1 = document.getElementById('pass1').value;
      const p2 = document.getElementById('pass2').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn-reset');
      if (p1.length > 0 && p1.length < 6) {
        msg.textContent = 'Senha deve ter pelo menos 6 caracteres.';
        msg.style.color = 'var(--red)'; btn.disabled = true;
      } else if (p2.length > 0 && p1 !== p2) {
        msg.textContent = 'As senhas não coincidem.';
        msg.style.color = 'var(--red)'; btn.disabled = true;
      } else {
        msg.textContent = ''; btn.disabled = false;
      }
    }

    async function doReset() {
      const p1 = document.getElementById('pass1').value;
      const p2 = document.getElementById('pass2').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn-reset');
      if (p1.length < 6) { msg.textContent = 'Senha deve ter pelo menos 6 caracteres.'; msg.style.color='var(--red)'; return; }
      if (p1 !== p2)     { msg.textContent = 'As senhas não coincidem.'; msg.style.color='var(--red)'; return; }
      btn.disabled = true; btn.textContent = 'Salvando…';
      const { error } = await _sb.auth.updateUser({ password: p1 });
      if (error) {
        msg.textContent = error.message; msg.style.color = 'var(--red)';
        btn.disabled = false; btn.textContent = 'Salvar nova senha';
      } else {
        msg.innerHTML = '✅ Senha alterada com sucesso! Redirecionando…';
        msg.style.color = 'var(--green)';
        setTimeout(() => location.href = 'index.html', 2000);
      }
    }
  </script>
</body>
</html>
