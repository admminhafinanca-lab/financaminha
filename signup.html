<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FinançaMinha — Criar conta</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#09090d;--s1:#111318;--s2:#181b22;--s3:#1e2230;
      --b1:rgba(255,255,255,.09);--b2:rgba(255,255,255,.15);
      --text:#eeeef0;--muted:#7a7f96;--dim:#4a4f66;
      --red:#f87171;--green:#4ade80;--acc:#c8ff57;
      --ff:'Syne',sans-serif;--fb:'Instrument Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
    button{font-family:var(--fb);cursor:pointer}
    input{font-family:var(--fb)}
    .wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
    .box{width:100%;max-width:400px}
    .logo{text-align:center;margin-bottom:2rem}
    .logo-title{font-family:var(--ff);font-size:28px;font-weight:700;color:var(--acc);letter-spacing:-.5px}
    .logo-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:2rem}
    .card-title{font-family:var(--ff);font-size:18px;font-weight:700;color:var(--text);margin-bottom:1.5rem}
    .field{margin-bottom:1rem}
    .field:last-of-type{margin-bottom:1.5rem}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
    input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
    input:focus{border-color:var(--acc)}
    .btn{width:100%;padding:12px;background:var(--acc);color:#09090d;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-ghost{width:100%;padding:11px;background:none;color:var(--muted);border:1px solid var(--b1);border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s;margin-top:10px}
    .btn-ghost:hover{border-color:var(--b2);color:var(--text)}
    .msg{margin-top:1rem;font-size:13px;text-align:center;min-height:20px;line-height:1.5}
    .footer{text-align:center;margin-top:1.25rem;font-size:12px;color:var(--dim)}
    .divider{text-align:center;color:var(--muted);font-size:12px;margin:1rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">
        <div class="logo-title">FinançaMinha</div>
        <div class="logo-sub">gestão financeira familiar</div>
      </div>
      <div class="card">
        <div class="card-title">Criar conta</div>

        <div class="field">
          <label>Seu nome</label>
          <input id="name" type="text" placeholder="Como quer ser chamado?">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com">
        </div>
        <div class="field">
          <label>Senha</label>
          <input id="pass" type="password" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doSignup()">
        </div>

        <button class="btn" id="btn-signup" onclick="doSignup()">Criar conta</button>

        <div class="divider">— ou —</div>

        <button class="btn-ghost" onclick="location.href='index.html'">Já tenho conta — entrar</button>

        <div class="msg" id="msg"></div>
      </div>
      <div class="footer">Seus dados ficam salvos na nuvem com segurança.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iapsjwiahrngytrxawrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6rRbVuPIfuF56utFPfVzLg_waXyH5XS';
    const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setMsg(html, isError = true) {
      const el = document.getElementById('msg');
      el.innerHTML = html;
      el.style.color = isError ? 'var(--red)' : 'var(--green)';
    }
    function setBusy(busy, label = 'Criar conta') {
      const btn = document.getElementById('btn-signup');
      btn.disabled = busy;
      btn.textContent = busy ? label : 'Criar conta';
    }
    function traduzErro(msg) {
      if (!msg) return 'Erro desconhecido.';
      if (msg.includes('User already registered')) return 'E-mail já cadastrado. <a href="index.html" style="color:var(--acc)">Clique para entrar</a>.';
      if (msg.includes('Too many requests')) return '⏳ Muitas tentativas. Aguarde alguns minutos.';
      return msg;
    }

    async function verificarCompraCakto(email) {
      try {
        const res = await fetch('https://iapsjwiahrngytrxawrj.supabase.co/functions/v1/smooth-handler', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ action: 'check_purchase', email })
        });
        if (!res.ok) return false;
        const json = await res.json();
        return json.approved === true;
      } catch { return false; }
    }

    async function reenviarConfirmacao(email) {
      try {
        await _sb.auth.resend({ type: 'signup', email });
        setMsg('📧 E-mail de confirmação reenviado. Verifique sua caixa de entrada e o spam.', false);
      } catch (err) {
        setMsg('Erro ao reenviar: ' + err.message);
      }
    }

    async function doSignup() {
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;

      if (!name)  { setMsg('Informe seu nome.'); return; }
      if (!email) { setMsg('Informe seu e-mail.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('E-mail inválido.'); return; }
      if (pass.length < 6) { setMsg('Senha deve ter pelo menos 6 caracteres.'); return; }

      setBusy(true, 'Verificando compra…'); setMsg('');

      try {
        const temCompra = await verificarCompraCakto(email);
        if (!temCompra) {
          setMsg('🔒 Acesso não encontrado.<br><span style="font-size:12px;color:var(--muted)">Este e-mail não possui compra ativa do FinançaMinha.</span>');
          return;
        }

        setBusy(true, 'Criando conta…');
        const { data, error } = await _sb.auth.signUp({
          email, password: pass,
          options: { data: { full_name: name } }
        });
        if (error) throw error;

        const jaExiste = data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;
        if (jaExiste) {
          const { error: loginErr } = await _sb.auth.signInWithPassword({ email, password: '##CHECK_ONLY##' });
          const msgLogin = loginErr?.message || '';
          if (msgLogin.includes('Email not confirmed')) {
            setMsg('⚠️ E-mail já cadastrado mas não confirmado. <a href="#" onclick="reenviarConfirmacao(\'' + email + '\');return false;" style="color:var(--acc)">Reenviar confirmação</a>.');
          } else {
            setMsg('⚠️ E-mail já possui cadastro. <a href="index.html" style="color:var(--acc)">Clique para entrar</a>.');
          }
          return;
        }

        if (data.user && !data.session) {
          setMsg('✅ Conta criada! Enviamos um link de confirmação para <strong>' + email + '</strong>. Clique no link para ativar.', false);
          return;
        }
        if (data.session) {
          location.href = 'app.html';
        }

      } catch (err) {
        setMsg(traduzErro(err.message));
      } finally {
        setBusy(false);
      }
    }
  </script>
</body>
</html>
