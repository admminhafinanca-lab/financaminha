<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FinançaMinha — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#09090d;--s1:#111318;--s2:#181b22;--s3:#1e2230;
      --b1:rgba(255,255,255,.09);--b2:rgba(255,255,255,.15);
      --text:#eeeef0;--muted:#7a7f96;--dim:#4a4f66;
      --red:#f87171;--acc:#c8ff57;
      --ff:'Syne',sans-serif;--fb:'Instrument Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
    button{font-family:var(--fb);cursor:pointer}
    input{font-family:var(--fb)}
    .wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
    .box{width:100%;max-width:400px}
    .logo{text-align:center;margin-bottom:2rem}
    .logo-title{font-family:var(--ff);font-size:28px;font-weight:700;color:var(--acc);letter-spacing:-.5px}
    .logo-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:2rem}
    .card-title{font-family:var(--ff);font-size:18px;font-weight:700;color:var(--text);margin-bottom:1.5rem}
    .field{margin-bottom:1rem}
    .field:last-of-type{margin-bottom:1.5rem}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
    input[type=email],input[type=password]{width:100%;padding:10px 12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
    input:focus{border-color:var(--acc)}
    .btn{width:100%;padding:12px;background:var(--acc);color:#09090d;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-ghost{width:100%;padding:11px;background:none;color:var(--muted);border:1px solid var(--b1);border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s;margin-top:10px}
    .btn-ghost:hover{border-color:var(--b2);color:var(--text)}
    .msg{margin-top:1rem;font-size:13px;text-align:center;min-height:20px;line-height:1.5}
    .footer{text-align:center;margin-top:1.25rem;font-size:12px;color:var(--dim)}
    .row-forgot{text-align:right;margin-top:6px}
    .link{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--fb)}
    .link:hover{color:var(--acc)}
    .divider{text-align:center;color:var(--muted);font-size:12px;margin:1rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">
        <div class="logo-title">FinançaMinha</div>
        <div class="logo-sub">gestão financeira familiar</div>
      </div>
      <div class="card">
        <div class="card-title">Entrar na conta</div>

        <div class="field">
          <label>E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="field">
          <label>Senha</label>
          <input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
          <div class="row-forgot">
            <button class="link" onclick="location.href='forgot.html'">Esqueci minha senha</button>
          </div>
        </div>

        <button class="btn" id="btn-login" onclick="doLogin()">Entrar</button>

        <div class="divider">— ou —</div>

        <button class="btn-ghost" onclick="location.href='signup.html'">Criar uma conta</button>

        <div class="msg" id="msg"></div>
      </div>
      <div class="footer">Seus dados ficam salvos na nuvem com segurança.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iapsjwiahrngytrxawrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6rRbVuPIfuF56utFPfVzLg_waXyH5XS';
    const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setMsg(html, isError = true) {
      const el = document.getElementById('msg');
      el.innerHTML = html;
      el.style.color = isError ? 'var(--red)' : 'var(--acc)';
    }
    function setBusy(busy) {
      const btn = document.getElementById('btn-login');
      btn.disabled = busy;
      btn.textContent = busy ? 'Entrando…' : 'Entrar';
    }
    function traduzErro(msg) {
      if (!msg) return 'Erro desconhecido.';
      if (msg.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
      if (msg.includes('Email not confirmed')) return '⚠️ E-mail não confirmado. Verifique sua caixa de entrada.';
      if (msg.includes('Too many requests')) return '⏳ Muitas tentativas. Aguarde alguns minutos.';
      return msg;
    }

    // Checa sessão ativa — se já logado, vai direto para o app
    _sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        location.href = 'forgot.html#recovery';
        return;
      }
      if (event === 'SIGNED_IN' && session) {
        location.href = 'app.html';
      }
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;
      if (!email) { setMsg('Informe seu e-mail.'); return; }
      if (!pass)  { setMsg('Informe sua senha.'); return; }
      setBusy(true); setMsg('');
      try {
        const { data, error } = await _sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        if (!data.user.email_confirmed_at) {
          await _sb.auth.signOut();
          setMsg('⚠️ Confirme seu e-mail antes de acessar.');
          return;
        }
        location.href = 'app.html';
      } catch (err) {
        setMsg(traduzErro(err.message));
      } finally {
        setBusy(false);
      }
    }
  </script>
</body>
</html>
